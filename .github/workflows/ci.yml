name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm --filter @ai-support/web lint

      - name: Type-check
        run: pnpm --filter @ai-support/web typecheck

      - name: Test
        run: pnpm --filter @ai-support/web test

      - name: Build
        run: pnpm --filter @ai-support/web build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest

  database:
    name: Database and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv and Python for persistence integration tests
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install backend dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Start local Supabase
        run: pnpm dev:supabase > /dev/null

      - name: Rebuild database from migrations
        run: pnpm db:reset

      - name: Lint database objects
        run: pnpm db:lint

      - name: Test row-level security
        run: pnpm db:test

      - name: Test API persistence and tenant isolation
        working-directory: apps/api
        env:
          M1_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
        run: uv run pytest tests/integration -m integration --no-cov

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
