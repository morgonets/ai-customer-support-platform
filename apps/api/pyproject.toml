[project]
name = "ai-customer-support-api"
version = "0.1.0"
description = "FastAPI backend for the AI Customer Support Platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "psycopg[binary,pool]>=3.3.3,<4.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pyjwt[crypto]>=2.12.1,<3.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.48,<3.0.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "mypy>=1.19.0,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.15.0,<1.0.0",
]

[tool.uv]
package = false
required-version = ">=0.12.5,<0.13.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "E", "F", "I", "RUF", "S", "SIM", "T20", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=100"
markers = ["integration: requires the local Supabase PostgreSQL service"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
show_missing = true
